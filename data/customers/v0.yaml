  CU-12: {customer_since_months:  9, total_orders:  4, refunds_last_12m: 2, account_flags: []}
  CU-13: {customer_since_months: 30, total_orders: 18, refunds_last_12m: 0, account_flags: []}
  CU-14: {customer_since_months: 47, total_orders: 29, refunds_last_12m: 1, account_flags: []}
  CU-15: {customer_since_months: 16, total_orders:  7, refunds_last_12m: 0, account_flags: []}
  CU-16: {customer_since_months: 38, total_orders: 24, refunds_last_12m: 2, account_flags: []}

  # Short tenure, heavy ordering, refunds on most of it, and a payments flag.
  CU-17: {customer_since_months:  4, total_orders: 11, refunds_last_12m: 7, account_flags: [chargeback_history]}

  CU-18: {customer_since_months: 25, total_orders: 14, refunds_last_12m: 1, account_flags: []}
  CU-19: {customer_since_months:  7, total_orders:  4, refunds_last_12m: 0, account_flags: []}
  CU-20: {customer_since_months: 33, total_orders: 20, refunds_last_12m: 2, account_flags: []}

  # Refunds on roughly half of everything ordered, but nobody has flagged the
  # account. G-FRD-002 has to notice this on its own; if a flag were set here,
  # G-FRD-001 would fire first and we could not tell which guideline caught it.
  CU-21: {customer_since_months: 11, total_orders: 19, refunds_last_12m: 9, account_flags: []}

  CU-22: {customer_since_months:  6, total_orders:  3, refunds_last_12m: 1, account_flags: []}
