# Customer profiles, joined onto the order at load time.
#
# Two guidelines read this and nothing else can reach them: G-FRD-002 asks
# whether someone has claimed an unusual number of refunds, and G-BUS-002 asks
# whether an unhappy customer has a good record worth protecting. Neither means
# anything unless good and bad records both exist to be told apart, so most
# profiles here are ordinary on purpose.
#
# account_flags is what a fraud or payments team would have set. Everything else
# is counted from the account itself.

customers:
  CU-01: {customer_since_months: 34, total_orders: 22, refunds_last_12m: 1, account_flags: []}
  CU-02: {customer_since_months:  8, total_orders:  3, refunds_last_12m: 0, account_flags: []}
  CU-03: {customer_since_months: 51, total_orders: 40, refunds_last_12m: 2, account_flags: []}
  CU-04: {customer_since_months: 19, total_orders: 11, refunds_last_12m: 1, account_flags: []}
  CU-05: {customer_since_months:  5, total_orders:  2, refunds_last_12m: 1, account_flags: []}
  CU-06: {customer_since_months: 27, total_orders: 15, refunds_last_12m: 0, account_flags: []}

  # Bereavement case. A long-standing account with almost no refund history —
  # exactly the record G-BUS-002 exists to notice.
  CU-07: {customer_since_months: 62, total_orders: 31, refunds_last_12m: 1, account_flags: []}

  CU-08: {customer_since_months: 14, total_orders:  6, refunds_last_12m: 0, account_flags: []}
