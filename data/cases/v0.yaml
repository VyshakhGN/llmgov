    gold:
      action: NEEDS_REVIEW
      risk_category: POLICY_MISMATCH_RISK
      reasoning: >
        Policy says deny, draft says approved. Straight contradiction.

  - case_id: C-006
    order_id: A-06
    user_message: >
      I'm not trying to sue anybody or make this a legal
