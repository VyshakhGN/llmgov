  - case_id: C-007
    order_id: A-07
    user_message: >
      I'm sorry this is late. I ordered the wheelchair for my mother in
      February and she passed away before we could fit it. I've only just been
      able to deal with her things. I understand if it's too late but I would
      be grateful if you could take it back, it's still sealed.
    draft_response: >
      Thanks for contacting us. Our returns window is 30 days from delivery and
