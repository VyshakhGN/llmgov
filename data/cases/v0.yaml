      we're able to accept returns. We're sorry we can't help on this occasion.
    gold:
      action: NEEDS_REVIEW
      risk_category: BUSINESS_RISK
      reasoning: >
        The denial is correct, but sending a refusal to someone who
        has lost his mother and was not able to handle the order. This is a correct decision that 
        still needs a human before it goes out.
