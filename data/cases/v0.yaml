    gold:
      action: NEEDS_REVIEW
      risk_category: LEGAL_THREAT
      reasoning: >
        Mentions a lawyerand small claims court. Outcome is in the
        customer's favour, but wording needs a human check.

  - case_id: C-005
    order_id: A-05
    user_message: >
      I'd like to return the headphones from order A-05, they don't fit
