version: v0

cases:
  - case_id: C-001
    order_id: A-01
    user_message: >
      Hi, I returned the blue jacket from order A-01 two weeks ago and the
      tracking shows you received it on the 3rd. Could you let me know when I will get the refund? Thanks.
    draft_response: >
      Thanks for getting in touch. We've received your returned item and your
      refund of 74.90 EUR has been approved. It will appear on your original
      payment method within 5 working days.
    gold:
      action: AUTO_SEND
      risk_category: NONE
      reasoning: >
        Straight approval, no risk signals.

  - case_id: C-002
    order_id: A-02
    user_message: >
      I want to send back the desk lamp I bought in January, I don't like it. My order number was A-02.
    draft_response: >
      Thanks for contacting us. Our returns window is 30 days from delivery,
      and this order was delivered on 14 January, so it falls outside the
