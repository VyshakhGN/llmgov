[project]
name = "llmgov"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gireesh" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "fastapi>=0.139.2",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
    "uvicorn>=0.51.0",
]

[project.scripts]
llmgov = "llmgov:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
